{% extends "base.html" %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <h2 class="auth-title">Reset Password</h2>
        <p style="color: var(--text-muted); margin-bottom: 1.5rem; text-align: center;">Enter your email address and
            we'll send you a link to reset your password.</p>
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-group">
                <label class="form-label">Email Address</label>
                <input type="email" name="email" class="form-input" required placeholder="name@example.com">
            </div>
            <button type="submit" class="btn">Send Reset Link</button>
        </form>
        <div class="auth-footer">
            Remembered your password? <a href="{{ url_for('login') }}">Sign in</a>
        </div>
    </div>
</div>
{% endblock %}
